version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private-net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: python-app
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_CSV_FILE: ${MYSQL_CSV_FILE}
      DB_RETRY_COUNT: ${DB_RETRY_COUNT}
      DB_RETRY_DELAY: ${DB_RETRY_DELAY}
    volumes:
      - ../scripts:/app/scripts
      - ../data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - private-net

networks:
  private-net:

volumes:
  mysql_data: