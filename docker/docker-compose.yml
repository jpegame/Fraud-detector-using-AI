version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - private-net
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: mongo-container
    restart: always
    networks:
      - private-net

  runner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: data-runner
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - private-net
    volumes:
    - ../data:/app/data:ro
    env_file:
    - .env

networks:
  private-net:

volumes:
  mysql_data: